# Vendor review intake form, installed by /tprm:vendor-github-sync setup.
# Before writing it to .github/ISSUE_TEMPLATE/vendor-review.yml:
# - Replace {{LABEL}} with tprm.json github.label and {{CLIENT}} with tprm.json client.
# - Replace {{ENTITY_OPTIONS}} with one "        - <entity>" line per tprm.json entity,
#   or delete the whole entity block when no entities are configured.
# - Delete these comment lines.
name: Vendor Review Request
description: Request approval for a new third-party vendor or service
title: "Vendor Review: "
labels: ["{{LABEL}}"]
body:
  - type: markdown
    attributes:
      value: |
        All services handling company or client data must be approved before use. The security team will review your request and follow up.

  - type: input
    id: vendor_name
    attributes:
      label: Vendor name
    validations:
      required: true

  - type: input
    id: vendor_url
    attributes:
      label: Vendor website
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: What does this vendor do for us?
      description: One or two sentences describing the business purpose.
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Internal owner
      description: Who at {{CLIENT}} is responsible for this vendor relationship?
    validations:
      required: true

  # Entity block: delete through the next blank line when no entities are configured.
  - type: dropdown
    id: entity
    attributes:
      label: Which entity will use this vendor?
      options:
{{ENTITY_OPTIONS}}
    validations:
      required: true

  - type: dropdown
    id: contract_status
    attributes:
      label: Contract status
      options:
        - Existing contract
        - Evaluating / trial
        - Free tier
    validations:
      required: true

  - type: checkboxes
    id: data_shared
    attributes:
      label: What data will we share with this vendor?
      options:
        - label: Client or customer data (documents, records, communications)
        - label: Customer PII (names, emails, contact info)
        - label: Employee data (HR, payroll, performance)
        - label: Source code or infrastructure configs
        - label: Internal documents (strategy, financials, contracts)
        - label: Meeting recordings or transcripts
        - label: None — no data shared

  - type: dropdown
    id: data_stored
    attributes:
      label: Will the vendor store or process that data in their own systems?
      options:
        - "Yes"
        - "No — access only, no storage"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: system_access
    attributes:
      label: Will the vendor have access to any of our internal systems?
      description: Integrations, OAuth permissions, admin access, or browser extension permissions. Write "None" if not.
    validations:
      required: true

  - type: dropdown
    id: login_method
    attributes:
      label: How will people log in?
      options:
        - SSO (company identity provider)
        - Username and password (vendor-managed)
        - API key or service account
        - N/A — no login required
    validations:
      required: true

  - type: dropdown
    id: mfa
    attributes:
      label: Does the vendor support MFA?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: soc2
    attributes:
      label: Does the vendor have a SOC 2 report, ISO 27001, or equivalent?
      options:
        - "Yes"
        - Will request
        - No / not sure
    validations:
      required: true

  - type: dropdown
    id: criticality
    attributes:
      label: What happens if this vendor goes down?
      options:
        - Critical — operations stop without it
        - Important — causes disruption but we can work around it
        - Nice-to-have — minimal impact
    validations:
      required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: Does this vendor use AI/ML to process our data?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else the security team should know?
      description: Urgency, special requirements, alternatives considered, etc.
